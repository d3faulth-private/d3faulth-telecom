[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "d3faulth-telecom"
version = "0.1.0"
description = "Isolated telecom signaling observability lab and terminal dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["telecom", "sigtran", "sctp", "tui", "security-lab"]
dependencies = []
[project.optional-dependencies]
tui = ["textual>=1.0,<7"]
dev = ["pytest>=8"]
[project.scripts]
telecom = "d3faulth_telecom.cli:main"
[tool.setuptools.packages.find]
where = ["src"]